<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `classDiagram
    class product {
        -string name
        -string category
        -double price
        +get_name() string
        +get_category() string
        +get_price() double
    }
    class cartItem {
        -product* p
        -int quantity
        +get_price() double
        +get_product() product*
    }
    class cart {
        -vector~cartItem~ item
        -bool loyalityMember
        -double originalTotal
        -double finalTotal
        -string payment_bank
        +get_payment_bank() string
        +get_originalTotal() double
        +get_finalTotal() double
        +get_loyality_Member() bool
        +addPDT(product*, int)
        +setLoyalityMember(bool)
        +setPaymentBank(string)
        +get_iten_list() vector
        +applyDiscount(double)
    }
    class DiscountStrategy {
        <<abstract>>
        +calculate(double)* double
    }
    class flatDiscountStrategy {
        -double DiscountAmt
        +calculate(double) double
    }
    class PercentDiscountStrategy {
        -double Percent
        +calculate(double) double
    }
    class PercenWithUpperCapDiscountStrategy {
        -double percent
        -double Amtcap
        +calculate(double) double
    }
    class PercenWithCapDiscountStrategy {
        -double percent
        -double cap
        +calculate(double) double
    }
    class DiscountStrategyManager {
        <<singleton>>
        -instance DiscountStrategyManager*
        +getInstance() DiscountStrategyManager*
        +getStrategy(S_type, double, double) DiscountStrategy*
    }
    class coupon {
        <<abstract>>
        -coupon* next
        +set_next(coupon*)
        +get_next() coupon*
        +getDiscount(cart*)* double
        +isApplicable(cart*)* bool
        +isCombinable() bool
        +name()* string
        +applyDiscount(cart*)
    }
    class BankingCoupon {
        -string bank
        -double minSpend
        -double percent
        -double offcap
        -DiscountStrategy* ds
        +isApplicable(cart*) bool
        +getDiscount(cart*) double
        +name() string
    }
    class loyaltyDiscount {
        -double percent
        -DiscountStrategy* ds
        +isApplicable(cart*) bool
        +getDiscount(cart*) double
        +name() string
    }
    class BulkPurchaseCoupon {
        -double threshold
        -double flatoff
        -DiscountStrategy* ds
        +isApplicable(cart*) bool
        +getDiscount(cart*) double
        +name() string
    }
    class SeasonalCoupon {
        -string catagory
        -double percent
        -DiscountStrategy* ds
        +isApplicable(cart*) bool
        +getDiscount(cart*) double
        +name() string
    }
    class CouponManager {
        <<singleton>>
        -coupon* head
        -instance CouponManager*
        +registerCoupon(coupon*)
        +setApplicable(cart*) vector
        +Apply_All(cart*) double
        +getInstance() CouponManager*
    }

    cartItem --> product : references
    cart "1" *-- "many" cartItem : contains
    DiscountStrategy <|-- flatDiscountStrategy
    DiscountStrategy <|-- PercentDiscountStrategy
    DiscountStrategy <|-- PercenWithUpperCapDiscountStrategy
    DiscountStrategy <|-- PercenWithCapDiscountStrategy
    DiscountStrategyManager ..> DiscountStrategy : creates
    coupon <|-- BankingCoupon
    coupon <|-- loyaltyDiscount
    coupon <|-- BulkPurchaseCoupon
    coupon <|-- SeasonalCoupon
    coupon --> coupon : next
    BankingCoupon --> DiscountStrategy : ds
    loyaltyDiscount --> DiscountStrategy : ds
    BulkPurchaseCoupon --> DiscountStrategy : ds
    SeasonalCoupon --> DiscountStrategy : ds
    CouponManager --> coupon : head`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
